vulnerability_assessment:
  scan_date: '2026-09-18'
  engine: CVSS_v4
  total_targets_scanned: 4
  findings_summary:
    critical: 1
    high: 1
    medium: 1
    low: 1
  findings:
  - cve_id: CVE-2024-6387
    target_ip: 192.168.10.15
    port: 22
    service: OpenSSH 9.2p1 Debian
    cvss_v4_score: 8.1
    severity: high
    title: OpenSSH Remote Code Execution (regreSSHion)
    remediation: Aggiornare immediatamente il demone OpenSSH alla versione 9.8p1 o
      superiore e disabilitare l'accesso root diretto.
    evidence_packet: SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u2 detected on target 192.168.10.15:22
  - cve_id: CVE-2023-48795
    target_ip: 192.168.10.1
    port: 22
    service: FortiOS FortiGate-60F SSH
    cvss_v4_score: 5.9
    severity: medium
    title: Terrapin SSH Protocol Flaw — Weak Encryption / MAC Negotiation
    remediation: Disabilitare i cifrari ChaCha20-Poly1305 e HMAC CBC su interfaccia
      di gestione firewall FortiOS.
    evidence_packet: Vulnerable KEX algorithm chacha20-poly1305@openssh.com negotiated
      on 192.168.10.1:22
  - cve_id: CVE-2024-21413
    target_ip: 192.168.10.20
    port: 443
    service: Microsoft Exchange Server 2019 CU12
    cvss_v4_score: 9.8
    severity: critical
    title: Microsoft Outlook / Exchange NTLM Credential Leaking Vulnerability
    remediation: Applicare Microsoft Security Update KB5035334 e forzare la disabilitazione
      di NTLM v1/v2 a favore di Kerberos/Modern Auth.
    evidence_packet: Exchange Server build 15.2.1118.7 missing MonikerLink mitigation
      patch
  - cve_id: VULN-TLS-001
    target_ip: 192.168.10.25
    port: 443
    service: Apache Tomcat 9.0 Web Portal Dogana
    cvss_v4_score: 3.7
    severity: low
    title: Uso di Protocolli Crittografici Deprecati TLS 1.0 / TLS 1.1
    remediation: Disabilitare TLSv1.0 e TLSv1.1 su server.xml e abilitare unicamente
      TLSv1.2 e TLSv1.3 con cipher suite PFS.
    evidence_packet: Server accepts TLSv1.0 with TLS_RSA_WITH_AES_128_CBC_SHA
